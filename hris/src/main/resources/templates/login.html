<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS — Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #334155 100%);
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .brand-mark {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: #0f172a;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px;
        }
        h1 { font-size: 20px; color: #0f172a; }
        .subtitle { color: #64748b; font-size: 13px; margin: 10px 0 26px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15, 23, 42, .12); }
        button {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        button:hover { background: #1e293b; }
        .alert {
            padding: 11px 14px;
            border-radius: 9px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .footer { margin-top: 22px; text-align: center; font-size: 12px; color: #94a3b8; }
        .footer a { color: #475569; }
    </style>
</head>
<body>
<main class="card">
    <div class="brand">
        <div class="brand-mark">HR</div>
        <h1>HRIS</h1>
    </div>
    <p class="subtitle">Connectez-vous à votre espace RH · Sign in to your HR workspace</p>

    <div class="alert alert-error" th:if="${param.error}">
        Identifiants invalides ou compte verrouillé.<br>
        Invalid credentials or locked account.
    </div>
    <div class="alert alert-info" th:if="${param.logout}">
        Vous avez été déconnecté. · You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Adresse e-mail · Email</label>
        <input type="email" id="username" name="username" autocomplete="username" autofocus required>

        <label for="password">Mot de passe · Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit">Se connecter · Sign in</button>
    </form>

    <p class="footer">
        Mot de passe oublié ? · Forgot password?
        <a th:href="${frontendUrl} + '/auth/forgot-password'" href="#">Réinitialiser</a>
    </p>
</main>
</body>
</html>
