# =============================================================================
# SECURITY NOTICE — DEVELOPMENT DEFAULTS
# =============================================================================
# This file contains placeholder defaults intended for local development only.
# Before deploying to any non-local environment, ROTATE the following secrets:
#   - spring.datasource.password           (default: hris_pass)
# Demo credentials (Admin123!, etc.) exist only when app.auth.demo-seed.enabled
# is true — never enable it outside local development.
# =============================================================================

spring:
  application:
    name: hris-backend

  threads:
    virtual:
      enabled: true

  datasource:
    # Runtime role: NOT the table owner — RLS policies apply (fail-closed).
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/hris_db}
    username: ${DATASOURCE_USER:hris_app}
    password: ${DATASOURCE_PASS:hris_app_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
    # Migrations run as the schema owner (RLS-exempt superuser in dev;
    # a BYPASSRLS role in prod), separate from the runtime hris_app role.
    # Explicit url: Boot cannot derive a datasource from the tenant-aware wrapper.
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/hris_db}
    user: ${FLYWAY_USER:hris_user}
    password: ${FLYWAY_PASS:hris_pass}

  # Form-login sessions of the embedded authorization server live in Postgres
  # (V60), so password change/reset can terminate them on every device.
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600s

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  transaction:
    default-timeout: 30

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  auth:
    # Issuer of our own tokens (embedded Spring Authorization Server)
    issuer: ${APP_AUTH_ISSUER:http://localhost:8081}
    frontend-url: ${APP_AUTH_FRONTEND_URL:http://localhost:4200}
    lockout:
      max-attempts: ${APP_AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      lock-minutes: ${APP_AUTH_LOCKOUT_LOCK_MINUTES:15}
    demo-seed:
      # Dev-only: seeds BCrypt credentials for the demo users (see DemoCredentialSeeder).
      enabled: ${APP_AUTH_DEMO_SEED_ENABLED:false}
  storage:
    attachments-root: ${APP_STORAGE_ATTACHMENTS_ROOT:./storage/attachments}
    exports-root: ${APP_STORAGE_EXPORTS_ROOT:./storage/exports}
  onboarding:
    login-url: ${APP_ONBOARDING_LOGIN_URL:http://localhost:4200}
  mail:
    from: ${APP_MAIL_FROM:no-reply@hris.local}
  leave:
    accrual:
      enabled: ${APP_LEAVE_ACCRUAL_ENABLED:false}
      cron: ${APP_LEAVE_ACCRUAL_CRON:0 0 5 * * *}
    cancelled-cleanup:
      cron: ${APP_LEAVE_CANCELLED_CLEANUP_CRON:0 0 * * * *}
      retention-hours: ${APP_LEAVE_CANCELLED_CLEANUP_RETENTION_HOURS:24}
  admin:
    sla-check:
      enabled: ${APP_ADMIN_SLA_CHECK_ENABLED:false}
      cron: ${APP_ADMIN_SLA_CHECK_CRON:0 0 */4 * * *}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,storage
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

server:
  port: 8081

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
  level:
    com.hris: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    org.springframework.retry: ${LOG_LEVEL_SPRING_RETRY:INFO}
